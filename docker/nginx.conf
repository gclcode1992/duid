worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Docker 内置 DNS，支持解析到多个 duid-server 副本
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location / {
            set $duid_upstream duid-server:8080;
            proxy_pass http://$duid_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
